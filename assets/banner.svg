<svg width="1200" height="340" viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="45%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>

    <radialGradient id="blob1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6a00" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff6a00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff1e8e" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff1e8e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e0ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#00e0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6a00">
        <animate attributeName="stop-color"
          values="#ff6a00;#ff1e8e;#a855f7;#00e0ff;#ff6a00"
          dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#ff1e8e">
        <animate attributeName="stop-color"
          values="#ff1e8e;#a855f7;#00e0ff;#ff6a00;#ff1e8e"
          dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00e0ff">
        <animate attributeName="stop-color"
          values="#00e0ff;#ff6a00;#ff1e8e;#a855f7;#00e0ff"
          dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <rect width="1200" height="340" fill="url(#bgGrad)"/>

  <g filter="url(#softGlow)">
    <circle cx="180" cy="90" r="140" fill="url(#blob1)">
      <animate attributeName="cx" values="180;260;180" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="90;140;90" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1020" cy="80" r="160" fill="url(#blob2)">
      <animate attributeName="cx" values="1020;930;1020" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="80;150;80" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="620" cy="280" r="180" fill="url(#blob3)">
      <animate attributeName="cy" values="280;220;280" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="260" r="130" fill="url(#blob4)">
      <animate attributeName="cx" values="900;830;900" dur="12s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g opacity="0.8">
    <circle cx="120" cy="250" r="3" fill="#ffffff">
      <animate attributeName="cy" values="250;220;250" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="230" r="2.5" fill="#ffffff">
      <animate attributeName="cy" values="230;200;230" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;1;0.2" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="60" r="2" fill="#ffffff">
      <animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="950" cy="55" r="2" fill="#ffffff">
      <animate attributeName="opacity" values="0.9;0.1;0.9" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="40" r="2.5" fill="#ffffff">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="290" r="2" fill="#ffffff">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="780" cy="300" r="2.5" fill="#ffffff">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="5.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="600" y="165" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif"
        font-size="64" font-weight="800" fill="url(#textGrad)" filter="url(#glow)">
    DHRUVI PATEL
  </text>

  <text x="600" y="210" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif"
        font-size="22" font-weight="500" fill="#f5f0ff" opacity="0.92">
    Full Stack Developer  ✦  AI-Assisted Builder  ✦  Open Source Contributor
  </text>

  <g font-family="Segoe UI, Verdana, sans-serif" font-size="14" fill="#c9c2e8" opacity="0.75">
    <text x="600" y="245" text-anchor="middle">React · Node.js · MongoDB · AI Engineering</text>
  </g>

  <path d="M0 340 L0 300 Q300 260 600 300 T1200 300 L1200 340 Z" fill="#0d0d17" opacity="0.55"/>
</svg>
